<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>מלאכי V128 — אתר הדגמה לאישור</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f7fbff}
    iframe{display:block;width:100%;height:100%;border:0;background:#f7fbff}
  </style>
</head>
<body>
  <iframe id="malachiDemo" src="../static-site/index.html" title="אתר מלאכי V128 — תצוגה מדויקת לאישור"></iframe>
  <script>
    const frame=document.querySelector('#malachiDemo');
    frame.addEventListener('load',()=>{
      try{
        const doc=frame.contentDocument;
        doc.querySelectorAll('a,button').forEach(element=>element.addEventListener('click',event=>event.preventDefault()));
      }catch(_error){}
    });
  </script>
</body>
</html>
