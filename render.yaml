services:
  - type: web
    name: malachi
    runtime: node
    plan: free
    region: oregon
    rootDir: app
    buildCommand: npm ci --omit=dev --no-audit --no-fund && npm cache clean --force
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_PROVIDER
        value: meta
      - key: MALACHI_SCHEDULER
        value: "true"
      - key: MALACHI_SELF_KEEPALIVE
        value: "false"
      - key: MALACHI_NO_RESPONSE_GRACE_MINUTES
        value: "30"
      - key: MALACHI_REMINDER_INTERVAL_MINUTES
        value: "30"
      - key: MALACHI_REMINDER_ATTEMPT_COUNT
        value: "3"
      - key: MALACHI_DAILY_CHECK_MODE
        value: single_ok
      - key: MALACHI_BETA_OPEN
        value: "true"
      - key: MALACHI_BETA_MAX_FAMILIES
        value: "100"
      - key: MALACHI_UK_PILOT_MAX_FAMILIES
        value: "30"
      - key: MALACHI_DEV_TOOLS
        value: "false"
      - key: MALACHI_TIMEZONE
        value: Asia/Jerusalem
      - key: MALACHI_PUBLIC_BASE_URL
        value: https://malachi-v78v.onrender.com
      - key: MALACHI_ALLOWED_ORIGINS
        value: https://malachi-v78v.onrender.com,https://malachi-static.onrender.com,https://malachi-uk-pilot.onrender.com
      - key: MALACHI_RETENTION_CHECKS_DAYS
        value: "180"
      - key: MALACHI_RETENTION_MESSAGES_DAYS
        value: "180"
      - key: MALACHI_RETENTION_AUDIT_DAYS
        value: "365"
      - key: MALACHI_RETENTION_FEEDBACK_DAYS
        value: "365"
      - key: MALACHI_RETENTION_WAITLIST_DAYS
        value: "180"
      - key: MALACHI_RETENTION_ERRORS_DAYS
        value: "365"
      - key: MALACHI_RETENTION_BACKUPS_DAYS
        value: "30"
      - key: HODAYA_AGENT_WINDOW_TEMPLATE
        value: hodaya_agent_window_open_he
      - key: HODAYA_AGENT_FAST_ACK
        value: "false"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIRESTORE_COLLECTION
        value: malachi_runtime
      - key: FIRESTORE_DOCUMENT
        value: main
      - key: META_GRAPH_VERSION
        value: v23.0
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_TEMPLATE_DAILY_CHECK
        value: daily_check_he
      - key: META_TEMPLATE_DAILY_REMINDER
        value: daily_check_reminder_he
      - key: META_TEMPLATE_OK_ACK
        value: daily_ok_ack_he
      - key: META_TEMPLATE_DISTRESS_ALERT
        value: distress_alert_he
      - key: META_TEMPLATE_NO_RESPONSE_ALERT
        value: no_response_alert_he
      - key: META_TEMPLATE_FAMILY_GREETING
        value: family_greeting_message_he
      - key: META_TEMPLATE_OPTIN
        value: contact_optin_he
      - key: META_TEMPLATE_CONTACT_OPTIN
        value: contact_optin_he
      - key: META_TEMPLATE_OPTIN_EN
        value: contact_optin_en
      - key: META_TEMPLATE_CONTACT_OPTIN_EN
        value: contact_optin_en
      - key: META_TEMPLATE_DAILY_CHECK_EN
        value: daily_check_en
      - key: META_TEMPLATE_DAILY_REMINDER_EN
        value: daily_check_reminder_en
      - key: META_TEMPLATE_OK_ACK_EN
        value: daily_ok_ack_en
      - key: META_TEMPLATE_NO_RESPONSE_ALERT_EN
        value: no_response_alert_en
  - type: web
    name: malachi-static
    runtime: static
    buildCommand: ops/build-static-site.sh
    staticPublishPath: static-site
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /admin*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /create-user.html
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /dashboard.html
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /feedback.html
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /login.html
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /manager.html
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /status.html
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /unsubscribe.html
        name: X-Robots-Tag
        value: noindex, nofollow
