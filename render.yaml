services:
  - type: web
    name: malachi
    runtime: node
    plan: free
    region: oregon
    rootDir: app
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_PROVIDER
        value: mock
      - key: MALACHI_SCHEDULER
        value: "true"
      - key: MALACHI_BETA_OPEN
        value: "true"
      - key: MALACHI_DEV_TOOLS
        value: "false"
      - key: MALACHI_TIMEZONE
        value: Asia/Jerusalem
      - key: META_GRAPH_VERSION
        value: v23.0
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_TEMPLATE_DAILY_CHECK
        value: daily_check_he
      - key: META_TEMPLATE_DISTRESS_ALERT
        value: distress_alert_he
      - key: META_TEMPLATE_NO_RESPONSE_ALERT
        value: no_response_alert_he
      - key: META_TEMPLATE_OPTIN
        value: optin_confirm_he
