services:
  - type: web
    name: malachi
    runtime: node
    plan: free
    region: oregon
    rootDir: app
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_PROVIDER
        value: meta
      - key: MALACHI_SCHEDULER
        value: "true"
      - key: MALACHI_SELF_KEEPALIVE
        value: "true"
      - key: MALACHI_SELF_KEEPALIVE_INTERVAL_MS
        value: "240000"
      - key: MALACHI_NO_RESPONSE_GRACE_MINUTES
        value: "7"
      - key: MALACHI_BETA_OPEN
        value: "true"
      - key: MALACHI_DEV_TOOLS
        value: "false"
      - key: MALACHI_TIMEZONE
        value: Asia/Jerusalem
      - key: MALACHI_PUBLIC_BASE_URL
        value: https://malachi-v78v.onrender.com
      - key: META_GRAPH_VERSION
        value: v23.0
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_TEMPLATE_DAILY_CHECK
        value: daily_check_he
      - key: META_TEMPLATE_DISTRESS_ALERT
        value: distress_alert_he
      - key: META_TEMPLATE_NO_RESPONSE_ALERT
        value: no_response_alert_he
      - key: META_TEMPLATE_FAMILY_GREETING
        value: family_greeting_message_he
      - key: META_TEMPLATE_OPTIN
        value: optin_confirm_he
      - key: META_TEMPLATE_CONTACT_OPTIN
        value: contact_optin_he
  - type: web
    name: malachi-static
    runtime: static
    buildCommand: ops/build-static-site.sh
    staticPublishPath: static-site
    pullRequestPreviewsEnabled: false
