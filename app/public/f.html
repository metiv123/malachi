<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta http-equiv="refresh" content="0;url=/?source=facebook"><title>מעבירים למלאכי</title><script>(()=>{const incoming=new URLSearchParams(location.search),allowedTrackingKeys=['ref','source','utm_source','utm_medium','utm_campaign','utm_content','utm_term'],outgoing=new URLSearchParams();if(!incoming.get('source')&&!incoming.get('utm_source'))incoming.set('source','facebook');allowedTrackingKeys.forEach(key=>incoming.getAll(key).forEach(value=>{const clean=value.trim().slice(0,120);if(clean)outgoing.append(key,clean)}));location.replace('/?'+outgoing.toString())})()</script></head><body><p><a href="/?source=facebook">מעבר לאתר מלאכי</a></p></body></html>
