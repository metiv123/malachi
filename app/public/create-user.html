<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>צור משתמש — מלאכי</title><link rel="stylesheet" href="/style.css"></head>
<body><a class="skip-link" href="#main">דלג לתוכן</a>
<header class="hero small-hero"><nav><a class="brand" href="/"><span class="logo">מ</span> מלאכי</a><span><a href="/login.html" class="nav-cta">כניסת משתמש</a> · <a href="/" class="nav-cta">דף הבית</a></span></nav></header>
<main id="main" class="section form-section auth-page">
  <div class="step-pill">שלב 1 מתוך 2 · יצירת משתמש</div>
  <h1>צור משתמש</h1>
  <p>יוצרים משתמש משפחתי. אחרי הכניסה לאזור האישי מוסיפים את פרטי ההורה, אנשי הקשר ושעת הבדיקה.</p>
  <form id="createUserForm">
    <label>שם מלא<input name="ownerName" required placeholder="למשל: מטיב" autocomplete="name"></label>
    <label>מייל<input type="email" name="ownerEmail" required placeholder="name@example.com" autocomplete="email"></label>
    <label>סיסמה<input type="password" name="password" required minlength="8" placeholder="לפחות 8 תווים" autocomplete="new-password"></label>
    <label>טלפון<input name="ownerPhone" required placeholder="0521234567 או +972521234567" autocomplete="tel"></label>
    <label class="check"><input type="checkbox" name="termsConsent" required> קראתי ואני מאשר/ת את <a href="/terms.html">תנאי השימוש</a> ואת <a href="/privacy.html">מדיניות הפרטיות</a></label>
    <label class="check"><input type="checkbox" name="marketingEmailConsent"> אני מאשר/ת לקבל במייל עדכונים, תוכן והצעות ממלאכי/מטיב. אפשר להסיר בכל עת.</label>
    <input type="hidden" name="source" id="sourceField" value="direct" />
    <input type="hidden" name="ref" id="refField" value="" />
    <input type="hidden" name="utm_source" id="utmSourceField" value="" />
    <input type="hidden" name="utm_medium" id="utmMediumField" value="" />
    <input type="hidden" name="utm_campaign" id="utmCampaignField" value="" />
    <input type="hidden" name="utm_content" id="utmContentField" value="" />
    <input type="hidden" name="utm_term" id="utmTermField" value="" />
    <button class="button primary" type="submit">צור משתמש</button>
  </form>
  <pre id="createUserResult"></pre>
  <p class="small">כבר יש לך משתמש? <a href="/login.html">כניסת משתמש</a></p>
</main>
<footer>מלאכי — המלאך השומר של המשפחה<br><a href="/privacy.html">מדיניות פרטיות</a> · <a href="/terms.html">תנאי שימוש</a></footer>
<script src="/create-user.js"></script>
<script src="/accessibility.js"></script></body></html>
