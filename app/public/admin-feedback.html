<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ניהול פידבקים — מלאכי</title><link rel="stylesheet" href="/style.css"></head>
<body><a class="skip-link" href="#main">דלג לתוכן</a>
<header class="hero small-hero"><nav><a class="brand" href="/"><span class="logo">מ</span> מלאכי</a><span><a href="/admin.html" class="nav-cta">אדמין</a> · <a href="/" class="nav-cta">דף הבית</a></span></nav></header>

<script>
const adminToken = new URLSearchParams(location.search).get('adminToken') || localStorage.getItem('malachi_admin_token') || '';
if (adminToken) localStorage.setItem('malachi_admin_token', adminToken);
function adminUrl(path){ const u = new URL(path, location.origin); if (adminToken) u.searchParams.set('adminToken', adminToken); return u.pathname + u.search; }
function adminFetch(path, options){ return fetch(adminUrl(path), options); }

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('a[href^="/admin"]').forEach((link) => {
    link.href = adminUrl(link.getAttribute('href'));
  });
});
</script>
<main id="main" class="section dashboard-page admin-feedback-page">
  <div class="section-title-row">
    <div>
      <h1>פידבקים</h1>
      <p>כל הפידבקים שנשלחו ממלאכי, כולל דירוג, תאריך, טקסט והקשר משפחתי אם קיים.</p>
    </div>
    <button class="button primary" onclick="loadFeedback()">רענון</button>
  </div>
  <div id="summary" class="feedback-summary"></div>
  <div id="feedbackList" class="feedback-list">טוען...</div>
</main>
<script>
function esc(value = '') { return String(value).replace(/[&<>\"]/g, (ch) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[ch])); }
function dateText(value) { try { return new Date(value).toLocaleString('he-IL'); } catch { return value || ''; } }
function ratingStars(rating) { const n = Number(rating || 0); return '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, Math.max(0, 5 - n)); }
async function loadFeedback(){
  const list = document.querySelector('#feedbackList');
  const summary = document.querySelector('#summary');
  list.textContent = 'טוען...';
  const res = await adminFetch('/api/feedback');
  const data = await res.json();
  const feedback = data.feedback || [];
  const avg = feedback.length ? (feedback.reduce((sum, item) => sum + Number(item.rating || 0), 0) / feedback.length).toFixed(1) : '—';
  summary.innerHTML = `<article><b>${feedback.length}</b><span>פידבקים</span></article><article><b>${avg}</b><span>דירוג ממוצע</span></article>`;
  if (!feedback.length) { list.innerHTML = '<article class="feedback-card">אין עדיין פידבקים.</article>'; return; }
  list.innerHTML = feedback.map((item) => {
    const family = item.family || {};
    const familyText = family.familyId ? `${esc(family.ownerName)} · ${esc(family.ownerEmail)} · ${esc(family.ownerPhone)}` : 'לא משויך למשתמש';
    return `<article class="feedback-card">
      <div class="feedback-card-head"><strong>${ratingStars(item.rating)} <span>${esc(item.rating || '')}/5</span></strong><time>${esc(dateText(item.createdAt))}</time></div>
      <p>${esc(item.text || 'ללא טקסט')}</p>
      <dl>
        <dt>משתמש</dt><dd>${familyText}</dd>
        <dt>מקור</dt><dd>${esc(item.source || '')}</dd>
        <dt>ID</dt><dd>${esc(item.id || '')}</dd>
      </dl>
    </article>`;
  }).join('');
}
loadFeedback();
</script>
<script src="/accessibility.js"></script></body></html>
