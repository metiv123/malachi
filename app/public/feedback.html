<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>פידבק — מלאכי</title><link rel="stylesheet" href="/style.css"></head><body><main class="section legal"><h1>פידבק על מלאכי</h1><form id="feedbackForm" class="feedback-form"><label>עד כמה זה ברור ושימושי?<select name="rating"><option value="5">5 - מאוד</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1 - לא מספיק</option></select></label><label>מה לשפר?<textarea name="text" rows="5"></textarea></label><button class="button primary">שליחת פידבק</button></form><pre id="result"></pre></main><script>document.querySelector('#feedbackForm').addEventListener('submit',async e=>{e.preventDefault();const payload=Object.fromEntries(new FormData(e.target).entries());const r=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});document.querySelector('#result').textContent=r.ok?'תודה, הפידבק נשמר.':'שגיאה בשמירה';e.target.reset();});</script><script src="/accessibility.js"></script></body></html>
