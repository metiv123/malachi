<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>כניסת משתמש — מלאכי</title><link rel="stylesheet" href="/style.css"></head>
<body><a class="skip-link" href="#main">דלג לתוכן</a>
<header class="hero small-hero"><nav><a class="brand" href="/"><span class="logo">מ</span> מלאכי</a><span><a href="/#join" class="nav-cta">צור משתמש</a> · <a href="/" class="nav-cta">דף הבית</a></span></nav></header>
<main id="main" class="section form-section auth-page">
  <div class="step-pill">כניסה לחשבון קיים</div>
  <h1>כניסת משתמש</h1>
  <p>כאן מנהלים את המשפחה, השעות, אנשי הקשר והיסטוריית הבדיקות.</p>
  <form id="loginForm">
    <label>מייל<input type="email" name="email" required autocomplete="email" placeholder="name@example.com"></label>
    <label>סיסמה<input type="password" name="password" required autocomplete="current-password" placeholder="לפחות 8 תווים"></label>
    <button class="button primary" type="submit">כניסת משתמש</button>
  </form>
  <pre id="loginResult"></pre>
  <p class="small">אין לך משתמש? <a href="/#join">צור משתמש חדש</a>. אם כבר יש לך קישור ניהול ישן, פתח אותו והגדר מייל וסיסמה מתוך האזור האישי.</p>
</main>
<footer>מלאכי — המלאך השומר של המשפחה<br><a href="/privacy.html">מדיניות פרטיות</a> · <a href="/terms.html">תנאי שימוש</a></footer>
