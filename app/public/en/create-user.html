<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create your free Malachi pilot account</title><link rel="stylesheet" href="/en/site.css"><link rel="icon" href="/assets/brand/malachi-mascot.png"></head>
<body><header><nav class="wrap"><a class="brand" href="/en/"><img src="/assets/brand/malachi-mascot.png" alt="">Malachi</a><a class="pill-link" href="/en/login.html">Sign in</a></nav></header><main class="wrap"><section class="auth"><span class="eyebrow">Step 1 of 2 · Free UK pilot</span><h1 style="font-size:clamp(2.2rem,6vw,3.6rem)">Create your family account</h1><p>First create the account for the family member who will manage Malachi. You will add your parent and alert contacts on the next screen.</p><p class="small">The pilot is free. No payment or card details are requested.</p>
<form id="createUserForm"><label>Your full name<input name="ownerName" required autocomplete="name" placeholder="e.g. Alex Taylor"></label><label>Email address<input type="email" name="ownerEmail" required autocomplete="email" placeholder="alex@example.com"></label><label>Password<input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></label><label>Your WhatsApp number<input name="ownerPhone" required autocomplete="tel" inputmode="tel" placeholder="+44 7700 900000"></label>
<label class="check"><input type="checkbox" name="termsConsent" required><span>I have read and agree to the <a href="/en/terms.html" target="_blank">Terms</a> and <a href="/en/privacy.html" target="_blank">Privacy Notice</a>.</span></label><label class="check"><input type="checkbox" name="marketingEmailConsent"><span>I would like to receive occasional Malachi updates by email. This is optional.</span></label>
<input type="hidden" name="language" value="en_US"><input type="hidden" name="country" value="GB"><input type="hidden" name="pilotCohort" value="uk_free_2026"><input type="hidden" name="pilotFree" value="true"><input type="hidden" name="source" id="sourceField" value="uk_direct"><input type="hidden" name="ref" id="refField"><input type="hidden" name="utm_source" id="utmSourceField"><input type="hidden" name="utm_medium" id="utmMediumField"><input type="hidden" name="utm_campaign" id="utmCampaignField"><input type="hidden" name="utm_content" id="utmContentField"><input type="hidden" name="utm_term" id="utmTermField">
<button class="button primary" type="submit">Create my free account</button></form><div id="createUserResult" class="result" role="status" aria-live="polite"></div><p class="small">Already registered? <a href="/en/login.html">Sign in</a>.</p></section></main><script src="/en/create-user.js"></script></body></html>
